name: OpenFront Roblox CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  roblox-luau-suite:
    name: Build OpenFront.rbxl & Run Headless Luau WASM Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python LZ4 dependency
        run: pip install lz4
      - name: Compile & Verify OpenFront.rbxl + OpenFront.rbxlx
        run: python3 roblox/tools/build_rbxl.py
      - name: Execute All 8 Headless Luau WebAssembly Suites (112 Scripts, 24 Full 1x Maps)
        run: node roblox/tests/run_tests.mjs
